[project]
name = "zotero-relink"
version = "0.1.0"
description = "Keeps Zotero's linked files linked when you move or rename them"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zotero-relink = "zotero_relink.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zotero_relink"]

[tool.pytest.ini_options]
testpaths = ["tests"]
